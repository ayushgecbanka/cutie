<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choti Don • Admin 👀</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top left,#35182f,transparent 35%),
        radial-gradient(circle at bottom right,#211a3b,transparent 35%),
        #09070d;
    color:white;
}

.container{
    width:min(1100px,94%);
    margin:auto;
    padding:25px 0 50px;
}

.card{
    background:#ffffff09;
    border:1px solid #ffffff15;
    border-radius:24px;
    padding:25px;
    margin:18px 0;
    backdrop-filter:blur(15px);
}

h1{
    margin:0 0 8px;
    font-size:38px;
}

h2{
    margin-top:0;
}

.muted{
    color:#aaa;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #ffffff18;
    background:#ffffff0b;
    color:white;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#c65fa5;
}

button{
    padding:13px 20px;
    border:0;
    border-radius:13px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:6px 5px 6px 0;
}

.primary{
    background:linear-gradient(135deg,#b85c95,#70457e);
}

.secondary{
    background:#ffffff0d;
    border:1px solid #ffffff15;
}

.danger{
    background:#71353f;
}

.status{
    margin-top:12px;
    color:#eab0cb;
    min-height:25px;
}

.hidden{
    display:none !important;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    padding:20px;
    border-radius:18px;
    background:#ffffff08;
    border:1px solid #ffffff10;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
}

.session{
    background:#ffffff06;
    border:1px solid #ffffff10;
    border-radius:20px;
    padding:20px;
    margin:15px 0;
}

.session-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.event{
    display:grid;
    grid-template-columns:180px 200px 1fr;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #ffffff0c;
    align-items:start;
}

.event:last-child{
    border-bottom:0;
}

.action{
    display:inline-block;
    background:#ffffff10;
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
}

.details{
    color:#d8cad7;
    word-break:break-word;
}

.time{
    color:#999;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:40px;
    color:#aaa;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#ffffff0d;
    color:#dca8cc;
    font-size:12px;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .event{
        grid-template-columns:1fr;
        gap:6px;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>


<body>

<div class="container">

<!-- HEADER -->

<div class="card">

<h1>❤️ Choti Don Admin</h1>

<p class="muted">
Private response dashboard 👀
</p>

</div>


<!-- LOGIN -->

<div id="loginCard" class="card">

<h2>🔐 Admin Login</h2>

<p class="muted">
Sirf authorised admin account se login karo.
</p>

<input
    id="email"
    type="email"
    placeholder="Admin Email"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
>

<button
    class="primary"
    id="loginBtn"
>
Login 🔓
</button>

<div
    id="loginStatus"
    class="status"
></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="stats">

<div class="stat">
<div class="muted">Sessions</div>
<div id="sessionCount" class="stat-number">0</div>
</div>

<div class="stat">
<div class="muted">Total Taps</div>
<div id="eventCount" class="stat-number">0</div>
</div>

<div class="stat">
<div class="muted">Latest Action</div>
<div
    id="latestAction"
    class="stat-number"
    style="font-size:18px"
>
-
</div>

</div>

</div>


<!-- CONTROLS -->

<div class="card">

<h2>👀 Activity</h2>

<button
    class="primary"
    id="refreshBtn"
>
🔄 Refresh
</button>

<button
    class="secondary"
    id="logoutBtn"
>
Logout
</button>

<button
    class="danger"
    id="hideBtn"
>
Hide Data
</button>

<p
    id="refreshStatus"
    class="status"
></p>

</div>


<!-- DATA -->

<div id="data">

<div class="empty">
Login karke data load karo 👀
</div>

</div>

</div>

</div>


<script type="module">

/* ==================================================
   FIREBASE IMPORTS
================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCTGAtFuTfJ7NonZeaVVbJ9PL_fKLPfUvs",

    authDomain:
        "cutie-f6575.firebaseapp.com",

    databaseURL:
        "https://cutie-f6575-default-rtdb.firebaseio.com",

    projectId:
        "cutie-f6575",

    storageBucket:
        "cutie-f6575.firebasestorage.app",

    messagingSenderId:
        "628249052732",

    appId:
        "1:628249052732:web:b3dc5ff3241832592e6539"
};


/* ==================================================
   ADMIN UID
================================================== */

const ADMIN_UID =
    "RI9763exEiNOYtfKN67euBgCSxW2";


/* ==================================================
   INITIALIZE FIREBASE
================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* ==================================================
   ELEMENTS
================================================== */

const loginCard =
    document.getElementById("loginCard");

const dashboard =
    document.getElementById("dashboard");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginStatus =
    document.getElementById("loginStatus");

const refreshBtn =
    document.getElementById("refreshBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const hideBtn =
    document.getElementById("hideBtn");

const dataContainer =
    document.getElementById("data");

const refreshStatus =
    document.getElementById("refreshStatus");


/* ==================================================
   LOGIN
================================================== */

loginBtn.addEventListener("click", login);


/*
   Enter key se bhi login
*/

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            login();
        }

    }
);


async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        loginStatus.innerText =
            "⚠️ Email aur password dono bharo.";

        return;
    }


    loginBtn.disabled = true;

    loginStatus.innerText =
        "⏳ Login ho raha hai...";


    try{

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        /*
           ADMIN UID CHECK
        */

        if(result.user.uid !== ADMIN_UID){

            await signOut(auth);

            loginStatus.innerText =
                "❌ Ye account authorised admin nahi hai.";

            loginBtn.disabled = false;

            return;
        }


        loginStatus.innerText =
            "✅ Login successful.";


        loginCard.classList.add("hidden");

        dashboard.classList.remove("hidden");


        await loadData();

    }

    catch(error){

        console.error(error);

        let message =
            error.message || "Login failed";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
                "Email ya password galat hai.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
                "Firebase Authentication mein user nahi mila.";

        }

        else if(
            error.code ===
            "auth/invalid-api-key"
        ){

            message =
                "Firebase API key invalid hai. Config check karo.";

        }


        loginStatus.innerText =
            "❌ " + message;


        loginBtn.disabled = false;
    }
}


/* ==================================================
   LOAD FIREBASE DATA
================================================== */

refreshBtn.addEventListener(
    "click",
    loadData
);


async function loadData(){

    dataContainer.innerHTML =
        '<div class="empty">⏳ Data load ho raha hai...</div>';

    refreshStatus.innerText =
        "";


    try{

        /*
           Sirf sessions read karna
        */

        const snapshot =
            await get(
                ref(db, "sessions")
            );


        if(!snapshot.exists()){

            dataContainer.innerHTML =
                '<div class="empty">' +
                '😴 Abhi koi interaction nahi mila.' +
                '<br><br>' +
                'Website se koi button tap hone ke baad yahan data dikhega.' +
                '</div>';

            updateStats(
                0,
                0,
                "-"
            );

            return;
        }


        const sessions =
            snapshot.val();


        let sessionCount = 0;

        let eventCount = 0;

        let latestAction = "-";

        let latestTimestamp = 0;


        dataContainer.innerHTML = "";


        const sessionEntries =
            Object.entries(sessions);


        /*
           Latest sessions first
        */

        sessionEntries.reverse();


        sessionEntries.forEach(
            ([uid, session]) => {

                sessionCount++;


                const events =
                    session.events || {};


                const eventEntries =
                    Object.entries(events);


                eventCount +=
                    eventEntries.length;


                /*
                   Latest event
                */

                eventEntries.forEach(
                    ([eventId, event]) => {

                        const timestamp =
                            Number(
                                event.timestamp || 0
                            );


                        if(
                            timestamp >
                            latestTimestamp
                        ){

                            latestTimestamp =
                                timestamp;

                            latestAction =
                                event.action ||
                                "-";
                        }

                    }
                );


                /*
                   Latest events first
                */

                eventEntries.sort(
                    (a,b) => {

                        return (
                            Number(
                                b[1].timestamp || 0
                            )
                            -
                            Number(
                                a[1].timestamp || 0
                            )
                        );

                    }
                );


                let html =

                    '<div class="session">' +

                    '<div class="session-title">' +

                    '👤 Session ' +

                    '<span class="badge">' +

                    escapeHTML(
                        uid.substring(0,12)
                    ) +

                    '...</span>' +

                    '</div>';


                if(eventEntries.length === 0){

                    html +=
                        '<div class="muted">' +
                        'No events found.' +
                        '</div>';

                }


                eventEntries.forEach(
                    ([eventId, event]) => {

                        let time =
                            "Unknown time";


                        if(event.timestamp){

                            const date =
                                new Date(
                                    Number(
                                        event.timestamp
                                    )
                                );


                            if(
                                !isNaN(
                                    date.getTime()
                                )
                            ){

                                time =
                                    date.toLocaleString();

                            }

                        }


                        /*
                           Details
                        */

                        const details = {
                            ...event
                        };


                        delete details.action;

                        delete details.timestamp;

                        delete details.page;


                        let detailText =
                            Object.keys(details).length
                            ? JSON.stringify(details)
                            : "No additional details";


                        html +=

                            '<div class="event">' +

                            '<div class="time">' +
                            escapeHTML(time) +
                            '</div>' +


                            '<div>' +

                            '<span class="action">' +

                            escapeHTML(
                                event.action ||
                                "unknown"
                            ) +

                            '</span>' +

                            '</div>' +


                            '<div class="details">' +

                            escapeHTML(
                                detailText
                            ) +

                            '<br><br>' +

                            '<span class="muted">' +

                            'Page: ' +

                            escapeHTML(
                                event.page || "-"
                            ) +

                            '</span>' +

                            '</div>' +

                            '</div>';

                    }
                );


                html +=
                    '</div>';


                dataContainer.innerHTML +=
                    html;

            }
        );


        updateStats(
            sessionCount,
            eventCount,
            latestAction
        );


        refreshStatus.innerText =
            "✅ Last refreshed: " +
            new Date().toLocaleTimeString();

    }

    catch(error){

        console.error(error);


        dataContainer.innerHTML =

            '<div class="empty">' +

            '❌ Firebase data load failed.' +

            '<br><br>' +

            escapeHTML(
                error.message
            ) +

            '</div>';

    }

}


/* ==================================================
   STATS
================================================== */

function updateStats(
    sessions,
    events,
    latest
){

    document.getElementById(
        "sessionCount"
    ).innerText =
        sessions;


    document.getElementById(
        "eventCount"
    ).innerText =
        events;


    document.getElementById(
        "latestAction"
    ).innerText =
        latest;

}


/* ==================================================
   LOGOUT
================================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

            location.reload();

        }

        catch(error){

            console.error(error);

        }

    }
);


/* ==================================================
   HIDE DATA
================================================== */

hideBtn.addEventListener(
    "click",
    function(){

        dataContainer.innerHTML =

            '<div class="empty">' +

            '🙈 Data hidden.' +

            '<br><br>' +

            'Refresh dabao to see it again 👀' +

            '</div>';

    }
);


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            function(char){

                return {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                }[char];

            }
        );

}

</script>

</body>
</html>
